[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "offckb-py-intergration-test"
version = "0.1.0"
description = "Black-box acceptance tests for the packaged offckb CLI"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "pytest>=7.3,<9",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "core: local devnet user-flow regressions, independent of review priority",
  "project: generated project creation, build, deployment and example tests",
  "network: explicitly enabled external downloads, excluded from offline runs",
]
